<html>
<head>
  <meta charset="utf-8">
  <title>Modificar Amigo</title>
</head>
<body>
  <h2>Modificar a {{ amigo.name }}</h2>
  <form method="POST">
    Nombre: <input type="text" name="name" value="{{ amigo.name }}" required><br><br>
    Latitud: <input type="text" name="lati" value="{{ amigo.lati }}" required><br><br>
    Longitud: <input type="text" name="longi" value="{{ amigo.longi }}" required><br><br>
    <button type="submit">Guardar cambios</button>
  </form>
  <br>
  <a href="{{ url_for('html.tabla_amigos') }}">Cancelar</a>
</body>
</html>
