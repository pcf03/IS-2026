<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HLS con ABR con Video.js</title>
  <!-- Estilos de Video.js desde el CDN -->
  <link href="https://vjs.zencdn.net/7.21.0/video-js.css" rel="stylesheet">
</head>
<body>
  <h1>HLS con ABR con Video.js</h1>

  <video id="my-video" class="video-js" controls preload="auto" width="640" height="264">
    <!-- Ahora el recurso es el SMIL de la app "abr": Wowza genera las 4 calidades -->
    <source src="http://192.168.1.14:1935/abr/smil:conejo.smil/playlist.m3u8"
            type="application/x-mpegURL">
    <p class="vjs-no-js">Activa JavaScript y usa un navegador moderno.</p>
  </video>

  <script src="https://vjs.zencdn.net/7.21.0/video.js"></script>
  <!-- Librerías que añaden el menú para elegir calidad (cada src en una sola línea) -->
  <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-quality-levels@2.0.7/dist/videojs-contrib-quality-levels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-hls-quality-selector@0.0.8/dist/videojs-hls-quality-selector.min.js"></script>
  <script>
    // Crea el reproductor sobre el <video> de id "my-video"
    videojs.options.vhs = { overrideNative: true };
    var player = videojs('my-video', { html5: { vhs: { overrideNative: true }, nativeAudioTracks: false, nativeVideoTracks: false } });
    // Activa el botón de selección de calidad
    player.hlsQualitySelector();
  </script>
</body>
</html>
