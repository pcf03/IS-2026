<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Apple HLS con Video.js</title>
  <!-- Estilos de Video.js desde el CDN (versión del PDF) -->
  <link href="https://vjs.zencdn.net/7.1.0/video-js.css" rel="stylesheet">
</head>

<body>
  <h1>HLS con Video.js</h1>

  <!-- id="my-video": con él identificamos este elemento desde JS -->
  <video id="my-video" class="video-js" controls preload="auto" width="640" height="264">
    <!-- src: la URL HLS de Wowza. Usa la IP de tu VM, NO la del contenedor -->
    <!-- type="application/x-mpegURL": avisa de que es una lista HLS, no un mp4 -->
    <source src="http://192.168.1.14:1935/abr/smil:conejo.smil/playlist.m3u8" type="application/x-mpegURL">
    <p class="vjs-no-js">Activa JavaScript y usa un navegador moderno.</p>
  </video>

  <!-- Cada src va en UNA sola línea (en el PDF se parte para que quepa, tú no lo partas) -->
  <script
    src="https://cdn.jsdelivr.net/npm/videojs-contrib-quality-levels@2.0.7/dist/videojs-contrib-quality-levels.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/videojs-hls-quality-selector@0.0.8/dist/videojs-hls-quality-selector.min.js"></script>
  <script>
    var player = videojs('my-video');
    // Activa el menú de calidades que añaden las dos librerías anteriores
    player.hlsQualitySelector();
  </script>
</body>

</html>
